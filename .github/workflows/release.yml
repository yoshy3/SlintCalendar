name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: slint-calendar.exe
            asset_name: slint-calendar-windows-x86_64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: slint-calendar
            asset_name: slint-calendar-linux-x86_64.zip
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: slint-calendar
            asset_name: slint-calendar-macos-x86_64.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: slint-calendar
            asset_name: slint-calendar-macos-aarch64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package macOS app
        if: startsWith(matrix.os, 'macos')
        run: |
          chmod +x build_app.sh
          ./build_app.sh ${{ matrix.target }}

      - name: Create archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $exe = "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
          Compress-Archive -Path $exe -DestinationPath ${{ matrix.asset_name }}

      - name: Create archive (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd target/${{ matrix.target }}/release
          zip ../../../${{ matrix.asset_name }} ${{ matrix.artifact_name }}

      - name: Create archive (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          cd target/release
          ditto -c -k --sequesterRsrc --keepParent SlintCalendar.app ../../${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Display structure
        run: ls -R ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./artifacts/**/*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
